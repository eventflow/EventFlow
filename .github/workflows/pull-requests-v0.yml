# https://github.com/eventflow/EventFlow/pull/967

name: pull-requests

on:
  push:
    branches: [ develop-v0 ]
  pull_request:
    branches: [ develop-v0 ]

jobs:
  build:
    runs-on: [self-hosted, windows-10]
    env:
      HELPZ_POSTGRESQL_USER: postgres
      HELPZ_POSTGRESQL_PASS: Password12!
      EVENTFLOW_MSSQL_SERVER: 127.0.0.1,1433
      EVENTFLOW_MSSQL_USER: sa
      EVENTFLOW_MSSQL_PASS: Password12!
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672"
      EVENTSTORE_URL: "tcp://admin:changeit@localhost:1113"
      ELASTICSEARCH_URL: "http://localhost:9200"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start containers used by integration tests
      run: |
        powershell -NoProfile -ExecutionPolicy unrestricted -Command ".\up-integration-environment.ps1"

    - name: Install .NET SDK for KurrentDB adapter
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Start isolated KurrentDB test databases
      run: docker compose -p eventflow-kurrentdb-tests -f docker-compose.kurrentdb.yml up -d --wait --force-recreate

    - name: Run KurrentDB adapter tests
      run: dotnet test Source/EventFlow.EventStores.KurrentDB.Tests/EventFlow.EventStores.KurrentDB.Tests.csproj -c Release -f net8.0 --logger trx

    - name: Run Bake
      run: |
        bake run --build-version 0.85.${{ github.run_number }}

    - name: Stop isolated KurrentDB test databases
      if: always()
      run: docker compose -p eventflow-kurrentdb-tests -f docker-compose.kurrentdb.yml down

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: packages
        path: "**/*nupkg"
        if-no-files-found: error

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-results
        path: "**/*.trx"
        if-no-files-found: error
